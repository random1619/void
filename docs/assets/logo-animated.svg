<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="200" height="200" fill="transparent" />
  
  <g transform="translate(100, 100)">
    <!-- Outer Ring -->
    <circle r="80" fill="none" stroke="#222" stroke-width="1" />
    <circle r="80" fill="none" stroke="#8c7851" stroke-width="2" stroke-dasharray="10 500">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>
    
    <!-- Inner geometric shape -->
    <path d="M 0 -40 L 34.64 20 L -34.64 20 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite" />
    </path>
    <path d="M 0 40 L -34.64 -20 L 34.64 -20 Z" fill="none" stroke="#8c7851" stroke-width="1.5" stroke-opacity="0.8" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
    </path>
    
    <!-- Center text -->
    <text y="5" font-family="'Inter', sans-serif" font-weight="bold" font-size="20" letter-spacing="4" fill="#ffffff" text-anchor="middle">
      V
    </text>
  </g>
</svg>
